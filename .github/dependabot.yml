version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps-backend)"

  - package-ecosystem: npm
    directory: /myActivities
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mobile
    commit-message:
      prefix: "chore(deps-mobile)"
    # Expo SDK 57 cible React Native 0.86. Les changements de version mineure
    # de React Native doivent être réalisés avec une montée de version Expo,
    # tandis que les correctifs 0.86.x restent proposés automatiquement.
    ignore:
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps-ci)"
